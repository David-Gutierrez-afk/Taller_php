<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" width="440" height="240">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="440" height="240" fill="url(#bg2)"/>
  <rect x="35" y="38" width="370" height="110" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <text x="220" y="84" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="url(#accent2)">0, 1, 1, 2, 3, 5, 8, 13...</text>
  <text x="220" y="126" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="900" fill="#e2e8f0">n! = 1 × 2 × 3 × ... × n</text>
  <text x="220" y="182" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="1.5">2. SUCESIONES</text>
  <text x="220" y="208" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">Fibonacci y Factorial</text>
</svg>
